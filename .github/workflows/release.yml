name: Release

# Publishes a GitHub Release (source code attached) for a version of Ciro:
#  - on master, when `version`, the release notes or this file change: the
#    version in `version`, if .github/release-notes/<version>.md exists and that
#    Release is not there yet - the tag is made here, on the pushed commit
#  - when a version tag (1.0.4, 1.1.0, ...) is pushed
#  - by hand (Actions -> Release -> Run workflow), for the version in `version`
# The notes come from .github/release-notes/<version>.md; without that file a
# tag or a manual run gets notes GitHub writes from the commits.
# Installs and updates do not use Releases - they take the master branch.
on:
  push:
    branches: [master]
    paths:
      - version
      - .github/release-notes/**
      - .github/workflows/release.yml
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="$(tr -d ' \t\r\n' < version)"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Not a version: '$TAG' - nothing to do"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - nothing to do"
            exit 0
          fi
          notes=".github/release-notes/${TAG}.md"
          if [ -f "$notes" ]; then
            set -- --notes-file "$notes"
          elif [ "$EVENT" = "push" ] && [ "$REF_TYPE" != "tag" ]; then
            echo "No $notes - a push to master does not publish $TAG without notes"
            exit 0
          else
            set -- --generate-notes
          fi
          gh release create "$TAG" --title "Ciro $TAG" --target "$GITHUB_SHA" "$@"
          echo "Published https://github.com/$GH_REPO/releases/tag/$TAG"
